[workspace]
members = ["crates/spark-core", "crates/spark-steam-bridge", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

# Source Guardian verifies large native inputs even in development builds.
# Optimize its checksum implementation without disabling checks or changing
# the application's debug assertions. The test profile inherits this setting.
[profile.dev.package."sha2:0.11.1"]
opt-level = 3
