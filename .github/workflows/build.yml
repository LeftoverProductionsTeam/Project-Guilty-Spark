name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-web:
    name: Core and web tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, verified 2026-10-26
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verified QA archive and retention contracts
        run: python -B scripts/maintenance/test_qa_vault.py
      - run: node --test scripts/native-qa-storage.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: cargo test -p spark-core --locked
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:offline
      - run: pnpm test:engine-sources
      - run: node --test scripts/probe-mcc-h1-interface.test.mjs
      - run: node --test scripts/analyze-opence-ai.test.mjs scripts/native-runtime-health.test.mjs scripts/recover-zombie-carriers-native.test.mjs scripts/native-tag-readback.test.mjs scripts/verify-native-sound-chains.test.mjs scripts/prepare-native-adpcm-waves.test.mjs
  windows-native:
    name: Windows native build and UI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, verified 2026-10-26
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verified QA archive and retention contracts
        run: python -B scripts/maintenance/test_qa_vault.py
      - run: node --test scripts/native-qa-storage.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace --locked
      - run: pnpm test:engine-sources
      - run: node --test scripts/probe-mcc-h1-interface.test.mjs scripts/analyze-opence-ai.test.mjs scripts/native-runtime-health.test.mjs scripts/recover-zombie-carriers-native.test.mjs scripts/native-tag-readback.test.mjs scripts/verify-native-sound-chains.test.mjs scripts/prepare-native-adpcm-waves.test.mjs
      - run: pnpm exec playwright install msedge
      - run: pnpm test:ui
      - run: node scripts/desktop.mjs build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guilty-spark-windows-x64
          path: |
            target/release/GuiltySpark.exe
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
