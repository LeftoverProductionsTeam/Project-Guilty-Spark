name: Desktop builds and core tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo test -p spark-core --locked
      - run: pnpm test
      - run: pnpm check
      - run: pnpm tauri build --no-bundle
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: guilty-spark-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/GuiltySpark
            target/release/GuiltySpark.exe
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
