[package]
name = "guilty-spark"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
spark-core = { path = "../crates/spark-core" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
notify = "8"
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_Memory"] }

[[bin]]
name = "GuiltySpark"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
