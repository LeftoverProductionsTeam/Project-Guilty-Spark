[package]
name = "spark-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
flate2 = "1"
zip = { version = "=9.1.0", default-features = false, features = ["deflate-flate2"] }
rusqlite = { version = "0.41", features = ["bundled"] }
manifold-rust = "=0.19.1"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }

[dev-dependencies]
tempfile = "3"
